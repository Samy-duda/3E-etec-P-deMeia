# ---------------------------------------------------------------------
# Pé-de-Meia - backend (MVP P0)
# Chaves de negócio: docs/agentes/02-arquitetura.md, seção 10.
# ---------------------------------------------------------------------

quarkus.application.name=pedemeia-backend
quarkus.http.port=8080
quarkus.http.root-path=/api

# Negócio (D07, P05, RN03)
pedemeia.bolsa.valor-mensal=300.00
pedemeia.processo.vagas-por-ano=10
pedemeia.jwt.expiracao-segundos=28800

# Contas de teste (D18): desligadas por padrão. Ligadas só em %dev e %test.
pedemeia.seed.contas-teste.ativo=false

# Primeiro ADMIN (Q10): só cria se USUARIOS estiver vazia. Sem variável, não cria.
pedemeia.bootstrap.admin.email=${PEDEMEIA_ADMIN_EMAIL:}
pedemeia.bootstrap.admin.senha=${PEDEMEIA_ADMIN_SENHA:}
pedemeia.bootstrap.admin.nome=${PEDEMEIA_ADMIN_NOME:Administrador}

# Banco: MySQL 8.0 (D01). Produção configura por variável de ambiente.
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=1

# Flyway (ADR-005): V1 é aplicado no boot. Hibernate só confere o esquema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# Segurança (ADR-006): endpoint sem anotação de perfil é negado.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
mp.jwt.verify.issuer=pedemeia
mp.jwt.verify.publickey.location=${PEDEMEIA_JWT_CHAVE_PUBLICA:jwt/chave-publica.pem}
smallrye.jwt.sign.key.location=${PEDEMEIA_JWT_CHAVE_PRIVADA:jwt/chave-privada.pem}
smallrye.jwt.new-token.issuer=pedemeia

# OpenAPI: só para conferência com o contrato
quarkus.smallrye-openapi.info-title=Pé-de-Meia - API do MVP (P0)
quarkus.smallrye-openapi.info-version=1.0.0

# Log: sem dados pessoais (ADR-006)
quarkus.log.category."io.quarkus.hibernate.orm.sql".level=WARN
quarkus.http.access-log.enabled=false

# ---------------------------------------------------------------------
# Desenvolvimento: MySQL do docker-compose (backend/docker-compose.yml)
# ---------------------------------------------------------------------
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://${PEDEMEIA_DB_HOST:localhost}:${PEDEMEIA_DB_PORTA:3306}/pedemeia
%dev.quarkus.datasource.username=${MYSQL_USER:pedemeia}
%dev.quarkus.datasource.password=${MYSQL_PASSWORD:}
%dev.pedemeia.seed.contas-teste.ativo=true
%dev.pedemeia.seed.contas-teste.senha=${PEDEMEIA_SEED_SENHA:TesteIA_2026}

# ---------------------------------------------------------------------
# Testes: DevServices sobe MySQL 8.0 via Testcontainers (ADR-007).
# Sem URL configurada, o Quarkus usa DevServices.
# ---------------------------------------------------------------------
%test.quarkus.datasource.devservices.image-name=mysql:8.0
%test.pedemeia.seed.contas-teste.ativo=true
%test.pedemeia.seed.contas-teste.senha=TesteIA_2026

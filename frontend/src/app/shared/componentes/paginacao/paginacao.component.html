<nav class="paginacao" aria-label="Paginação">
  <button type="button" class="botao secundario" [disabled]="!temAnterior()" (click)="anterior()">Anterior</button>
  <span>Página {{ pagina() + 1 }} de {{ totalPaginas() > 0 ? totalPaginas() : 1 }}</span>
  <button type="button" class="botao secundario" [disabled]="!temProxima()" (click)="proxima()">Próxima</button>
</nav>
